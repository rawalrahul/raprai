<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
      margin-bottom: 16px;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-bar.connected {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
    .status-bar.disconnected {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }

    label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus {
      border-color: #f59e0b;
    }
    input::placeholder {
      color: #555;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-connect {
      background: #f59e0b;
      color: #1a1a2e;
    }
    .btn-disconnect {
      background: #ef4444;
      color: white;
    }
    .tools-info {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }
    .tools-info strong {
      color: #999;
    }
    .error-msg {
      margin-top: 8px;
      font-size: 12px;
      color: #ef4444;
      display: none;
    }
  </style>
</head>
<body>

  <h1>RAPR AI Browser Tools</h1>
  <p class="subtitle">Connect Chrome to your RAPR AI instance</p>

  <div id="statusBar" class="status-bar disconnected">
    <span id="statusDot" class="dot red"></span>
    <span id="statusText">Disconnected</span>
  </div>

  <div id="connectForm">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:8000" value="http://localhost:8000">

    <label for="token">Bearer Token (auto-fetched if left blank)</label>
    <input type="password" id="token" placeholder="Leave blank to auto-detect">

    <button id="connectBtn" class="btn-connect">Connect</button>
  </div>

  <div id="disconnectForm" style="display:none">
    <button id="disconnectBtn" class="btn-disconnect">Disconnect</button>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <div id="toolsInfo" class="tools-info" style="display:none">
    <strong>12 browser tools available:</strong><br>
    list_tabs, navigate, read_page, click, type_text, find_element,
    screenshot, get_page_text, close_tab, new_tab, extract_table, fill_form
  </div>

  <script src="popup.js"></script>
</body>
</html>
