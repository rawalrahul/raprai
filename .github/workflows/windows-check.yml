name: Windows check

# Installs RAPR on a real Windows machine with scripts/install-windows.ps1 (the
# one-line PowerShell install), checks the shortcuts and the "rapr" command,
# starts RAPR, checks it answers, and stops it. Free for public repositories.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/install-windows.ps1
      - .github/workflows/windows-check.yml
  pull_request:
    paths:
      - scripts/install-windows.ps1
      - .github/workflows/windows-check.yml

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with the one-line installer
        shell: powershell
        env:
          RAPR_SOURCE_DIR: ${{ github.workspace }}
          RAPR_NO_OPEN: "1"
          RAPR_YES: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.ps1
          if ($LASTEXITCODE) { throw "installer exited with $LASTEXITCODE" }

      - name: Shortcuts, launcher and the rapr command are there
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $h = Join-Path $env:LOCALAPPDATA 'rapr-ai'
          foreach ($f in @("$h\launch.pyw", "$h\rapr.ps1", "$h\bin\rapr.cmd", "$h\venv\Scripts\pythonw.exe",
                           "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\RAPR AI.lnk")) {
            if (-not (Test-Path $f)) { throw "missing: $f" }
          }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($user -split ';') -notcontains "$h\bin") { throw "rapr isn't on the user PATH: $user" }

      - name: rapr start, RAPR answers with the setup page, rapr stop
        shell: powershell
        run: |
          $rapr = Join-Path $env:LOCALAPPDATA 'rapr-ai\bin\rapr.cmd'
          $data = Join-Path $env:LOCALAPPDATA 'RAPR AI'
          & $rapr start
          $port = $null; $up = $false
          foreach ($i in 1..60) {
            if (Test-Path "$data\web_port") {
              $port = (Get-Content "$data\web_port" -Raw).Trim()
              try { Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/health" -TimeoutSec 3 | Out-Null; $up = $true; break } catch {}
            }
            Start-Sleep -Seconds 2
          }
          if (-not $up) { Get-Content "$data\logs\helm.log" -Tail 80 -ErrorAction SilentlyContinue; throw 'RAPR did not start' }
          # First run: RAPR sends you to its setup page.
          $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/"
          if ($r.Content -notmatch 'Setup</title>') { throw 'expected the setup page on first run' }
          'first run shows the setup page'

          $s = & $rapr status | Out-String
          $s
          if ($s -notlike '*is running*') { throw 'rapr status should say running' }
          & $rapr stop
          Start-Sleep -Seconds 3
          $s = & $rapr status | Out-String
          $s
          if ($s -notlike '*not running*') { throw 'RAPR still running after rapr stop' }

      - name: Log on failure
        if: failure()
        shell: powershell
        run: |
          Get-Content (Join-Path $env:LOCALAPPDATA 'RAPR AI\logs\console.log') -Tail 80 -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:LOCALAPPDATA 'RAPR AI\logs\helm.log') -Tail 150 -ErrorAction SilentlyContinue
