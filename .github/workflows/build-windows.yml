name: Build Windows installer

# Compiles RAPR AI with Nuitka (via build.bat) and packages it with Inno Setup
# on a clean Windows runner. The installer is uploaded as a workflow artifact
# named RAPR_AI_Setup.exe, ready to attach to the rawalrahul/rapr-releases
# release that raprai.com/download links to.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['ci/windows-build']

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: cmd

    steps:
      - uses: actions/checkout@v4

      # 3.12: newest Python that Nuitka and fastembed/onnxruntime wheels all support,
      # so semantic memory is bundled (build.bat skips it when fastembed is absent).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard pypdf

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }

      - name: Build (build.bat)
        run: build.bat

      - name: Check installer and rename for release
        shell: pwsh
        run: |
          $out = Get-ChildItem installer_output\RAPR_AI_Setup_*.exe | Select-Object -First 1
          if (-not $out) { throw 'Installer was not produced - see the build step log.' }
          if (-not (Test-Path web_app.dist\web_app.exe)) { throw 'web_app.exe missing from dist.' }
          Copy-Item $out.FullName installer_output\RAPR_AI_Setup.exe
          $mb = [math]::Round((Get-Item installer_output\RAPR_AI_Setup.exe).Length / 1MB, 1)
          $sha = (Get-FileHash installer_output\RAPR_AI_Setup.exe -Algorithm SHA256).Hash
          "Built $($out.Name) -> RAPR_AI_Setup.exe ($mb MB)"
          "SHA256: $sha"
          "### RAPR_AI_Setup.exe`n- Size: $mb MB`n- SHA256: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      # Smoke test: the compiled app must start and serve its web UI.
      - name: Smoke test web_app.exe
        shell: pwsh
        run: |
          Copy-Item .env.example web_app.dist\.env
          $p = Start-Process -FilePath web_app.dist\web_app.exe -WorkingDirectory web_app.dist -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8000/setup -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-ChildItem web_app.dist\logs -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          if (-not $ok) { throw 'web_app.exe did not serve /setup within 2 minutes.' }
          'Smoke test passed: /setup returned 200.'

      - uses: actions/upload-artifact@v4
        with:
          name: RAPR_AI_Setup
          path: installer_output/RAPR_AI_Setup.exe
          if-no-files-found: error
          retention-days: 30
