name: Server image

# Builds the RAPR AI server image and publishes it to GitHub Container Registry
# as ghcr.io/<owner>/raprai (public, free), for Intel/AMD and ARM servers.
# Runs on v* tags or by hand.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ARM too: Oracle's free Ampere servers and Raspberry Pis are arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/raprai
          tags: |
            type=ref,event=tag
            # latest: from a v* tag, or a manual run on main.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name rapr-smoke -p 8000:8000 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1 | cut -d, -f1)"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "Health check passed."; exit 0; fi
            sleep 3
          done
          docker logs rapr-smoke | tail -80
          exit 1
