name: Server image

# Builds the RAPR AI server image and publishes it to GitHub Container Registry
# as ghcr.io/<owner>/raprai (public, free). Runs on v* tags or by hand.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/raprai
          tags: |
            type=ref,event=tag
            # latest: from a v* tag, or a manual run on main.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name rapr-smoke -p 8000:8000 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1 | cut -d, -f1)"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; echo "Health check passed."; exit 0; fi
            sleep 3
          done
          docker logs rapr-smoke | tail -80
          exit 1
